services:
  - type: web
    name: ds-bimbel-v34
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    preDeployCommand: node server/init-db.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ds-bimbel-v34-db
          property: connectionString
databases:
  - name: ds-bimbel-v34-db
    plan: free
    region: singapore
