services:
  - type: web
    name: ds-bimbel
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ds-bimbel-db
          property: connectionString
databases:
  - name: ds-bimbel-db
    plan: free
    region: singapore
